<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TURVI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1a2233 0%, #0b0e14 100%);
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(18, 22, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 36px 20px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .section-title {
      align-self: flex-start;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8b949e;
      margin: 8px 0 10px 4px;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Кнопки покупки FunPay */
    .btn-buy {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #ffffff;
      border: 1px solid rgba(59, 130, 246, 0.35);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .btn-buy:hover {
      background: linear-gradient(135deg, #273549, #162035);
      border-color: rgba(59, 130, 246, 0.7);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
    }

    .btn-buy .tag {
      font-size: 12px;
      font-weight: 700;
      color: #38ef7d;
      background: rgba(56, 239, 125, 0.12);
      border: 1px solid rgba(56, 239, 125, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Кнопка Канала */
    .btn-channel {
      background: linear-gradient(135deg, #0088cc, #006699);
      color: #ffffff;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.35);
    }

    .btn-channel:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(0, 136, 204, 0.5);
      background: linear-gradient(135deg, #0099e6, #0077b3);
    }

    /* Кнопка Чата */
    .btn-chat {
      background: rgba(255, 255, 255, 0.05);
      color: #e6edf3;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-chat:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 10px 0 16px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="avatar">⚡</div>

    <!-- Блок товаров -->
    <div class="section-title">Купить доступ</div>
    <div class="links-list">
      <!-- 1 День -->
      <a href="https://funpay.com/lots/offer?id=82110279" target="_blank" class="btn btn-buy">
        <div class="btn-content">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"/></svg>
          <span>Подписка: 1 DAY</span>
        </div>
        <span class="tag">FunPay</span>
      </a>

      <!-- 3 Дня -->
      <a href="https://funpay.com/lots/offer?id=82202456" target="_blank" class="btn btn-buy">
        <div class="btn-content">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"/></svg>
          <span>Подписка: 3 DAYS</span>
        </div>
        <span class="tag">FunPay</span>
      </a>
    </div>

    <div class="divider"></div>

    <!-- Блок контактов -->
    <div class="section-title">Контакты и сообщество</div>
    <div class="links-list" style="margin-bottom: 0;">
      <!-- Telegram Канал -->
      <a href="https://t.me/turvi_off" target="_blank" class="btn btn-channel">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .36z"/></svg>
        Telegram канал
      </a>

      <!-- Telegram Чат -->
      <a href="https://t.me/turvichat" target="_blank" class="btn btn-chat">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
        Telegram чат
      </a>
    </div>
  </div>

</body>
</html>
